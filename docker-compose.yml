services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    tty: true
    volumes:
      - xui-data:/etc/x-ui
      - xui-cert:/root/cert
    expose:
      - "2053"
      - "2096"
    ports:
      - "443:443/tcp"

  nginx:
    image: nginx:alpine
    container_name: 3x-ui-nginx
    restart: unless-stopped
    depends_on:
      - 3x-ui
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  xui-data:
  xui-cert:
